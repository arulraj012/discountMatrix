# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: cust.discountapp

type: application

framework:
  name: SAPUI5
  version: "1.146.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.unified
    - name: sap.f
    - name: sap.fe.core
    - name: sap.fe.templates
    - name: themelib_sap_horizon

resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8

builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: custdiscountapp
        relativePaths: true
        additionalFiles:
          - xs-app.json