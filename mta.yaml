_schema-version: 3.3.0
ID: cxDiscountmatrix
description: A simple CAP project.
version: 1.0.1
modules:
  - name: cxDiscountmatrix-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: cxDiscountmatrix-auth
      - name: cxDiscountmatrix-db
      - name: cxDiscountmatrix-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
  - name: cxDiscountmatrix-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: cxDiscountmatrix-db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
  - name: cxDiscountmatrix
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: cxDiscountmatrix-auth
      - name: cxDiscountmatrix-destination
      - name: cxDiscountmatrix-repo-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: cxDiscountmatrix-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: cxDiscountmatrix-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - custdiscountapp.zip
          name: custdiscountapp
          target-path: resources/
  - name: custdiscountapp
    type: html5
    path: app/discountapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: cxDiscountmatrix-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: cxDiscountmatrix
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: cxDiscountmatrix-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: cxDiscountmatrix-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
  - name: cxDiscountmatrix-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: cxDiscountmatrix-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: cxDiscountmatrix-html5-service
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: false
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
